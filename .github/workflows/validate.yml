name: Validate add-ons
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/underground-tech-pack-m0']
permissions:
  contents: read
jobs:
  validate:
    name: UTP foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/utp.py validate
      - run: python -m unittest discover -s tests -v
      - run: python tools/utp.py build
      - run: python -m compileall -q tools tests
      - name: Check committed changes for whitespace errors
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git diff --check "$PR_BASE...HEAD"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BASE" HEAD
          else
            # A new branch push has no previous commit; check its full tree.
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi

  launcher:
    name: Android launcher build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare existing Android SDK and ephemeral debug key
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          keytool -genkeypair -keystore "$RUNNER_TEMP/launcher-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 30
      - name: Build app and instrumentation APKs; verify signatures
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/launcher-debug.keystore
        run: |
          python tools/android-addon-launcher/build.py
          python tools/android-addon-launcher/build.py --test
          python -m py_compile tools/android-addon-launcher/build.py
      - run: git diff --check
