name: Validate add-ons
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: UTP foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/utp.py validate
      - run: python -m unittest discover -s tests -v
      - run: python tools/utp.py build
      - run: python -m compileall -q tools tests
      - run: git diff --check
